server {
    listen 80;
    location /select/jaeger/api/traces {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' '*';
        return 200 '{"data":[{"traceID":"stub-trace-123","spans":[{"operationName":"GET /labs","serviceName":"backend","durationMicroseconds":15000}]}]}';
    }
    location / {
        return 200 '{"status":"ok","message":"VictoriaTraces API stub"}';
    }
}
