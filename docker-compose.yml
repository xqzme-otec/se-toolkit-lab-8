services:
  nanobot:
    build:
      context: ./nanobot
      additional_contexts:
        repo: .
    restart: unless-stopped
    networks:
      - lms-network
    environment:
      - LLM_API_KEY=local-proxy-key
      - LLM_API_BASE_URL=http://qwen-code-api:8080/v1
      - LLM_API_MODEL=coder-model
      - NANOBOT_LMS_BACKEND_URL=http://backend:8000
      - NANOBOT_LMS_API_KEY=my-secret-api-key-123
      - NANOBOT_GATEWAY_CONTAINER_ADDRESS=0.0.0.0
      - NANOBOT_GATEWAY_CONTAINER_PORT=18790
      - NANOBOT_WEBCHAT_CONTAINER_ADDRESS=0.0.0.0
      - NANOBOT_WEBCHAT_CONTAINER_PORT=8765
      - NANOBOT_ACCESS_KEY=testkey123
      - NANOBOT_WORKSPACE=/app/workspace
    volumes:
      - ./nanobot:/app/nanobot
      - ./mcp:/app/mcp
      - ./nanobot-websocket-channel:/app/nanobot-websocket-channel
      - ./nanobot/workspace:/app/workspace
    ports:
      - "18790:18790"
      - "8765:8765"
    depends_on:
      - qwen-code-api
      - backend

  qwen-code-api:
    image: python:3.12-slim
    restart: unless-stopped
    networks:
      - lms-network
    ports:
      - "42005:8080"
    volumes:
      - ./scripts/qwen_mock.py:/app/qwen_mock.py:ro
    command: ["sh", "-c", "pip install fastapi uvicorn && python /app/qwen_mock.py"]

  backend:
    image: python:3.12-slim
    restart: unless-stopped
    networks:
      - lms-network
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/backend_mock.py:/app/backend_mock.py:ro
    command: ["sh", "-c", "pip install fastapi uvicorn && python /app/backend_mock.py"]

  client-web-flutter:
    build:
      context: ./nanobot-websocket-channel/client-web-flutter
    volumes:
      - client-web-flutter:/output

  caddy:
    image: caddy:2.11-alpine
    networks:
      - lms-network
    depends_on:
      - client-web-flutter
      - nanobot
    ports:
      - "42002:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - client-web-flutter:/srv/flutter:ro

volumes:
  client-web-flutter:

networks:
  lms-network:
    name: lms-network
    attachable: true
